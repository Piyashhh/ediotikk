E(16,'Waris Shah','What is the background of I Say unto Waris Shah?','It was written after the Partition of 1947. Pritam saw killing, rape and refugees in Punjab. She calls on Waris Shah, who wrote the love story Heer, to rise and write a new sad story for Punjab.'),
E(16,'Gitanjali','Comment on the imagery in Light, Oh Where Is the Light?','Tagore paints a dark night with a lamp that has no flame. The darkness shows a soul longing for God’s light, and the unlit lamp is the heart waiting to be lit.'),
E(16,'The Quilt','How does The Quilt bring out the taboo of female sexuality? Give two instances.','1) Begum Jaan, ignored by her husband, finds comfort with the masseuse Rabbo, and their closeness under the quilt hints at desire. 2) The child narrator sees the quilt move like a giant shape in the dark and is frightened, showing that such desire is hidden and cannot be spoken of.'),
E(16,'The Quilt','How did Begum Jaan’s appearance change during the story?','At first she was pale, thin and sickly. After Rabbo returned she became healthy, plump and glowing.'),

E(17,'Eagleton: Literature & History','In Marxist terms, what is the basic economic structure of society called? What cultural system depends on it?','The base. The superstructure (law, politics, ideas, art, literature).'),

E(18,'Iliad I–II','Why does Apollo send a plague upon the Achaean camp in Book I?','Agamemnon refused to return Chryseis, the daughter of Apollo’s priest Chryses, and drove the priest away. Apollo punished the whole army.'),
E(18,'Iliad I–II','Who sends a false dream to whom in Book II, promising the capture of Troy?','Zeus sends it to Agamemnon, telling him he can take Troy now.'),
E(18,'Oedipus the King','Who were the biological parents of Oedipus?','Laius and Jocasta, king and queen of Thebes.'),
E(18,'Oedipus the King','What was the prophecy of the Oracle of Delphi about Oedipus?','That he would kill his father and marry his mother.'),
E(18,'Pot of Gold','What is the name of Euclio’s daughter? Whom does she marry at the end?','Phaedria; she marries Lyconides.'),
E(18,'Story of Bacchus','How does Jupiter save the unborn Bacchus in Book III?','Semele is burned up by Jupiter’s lightning. Jupiter takes the unborn baby and sews him into his own thigh until he is ready to be born.'),
E(19,'Sonnet 43','What does “lost saints” mean in How Do I Love Thee?','The saints she prayed to in childhood faith and no longer believes in. She now gives that old devotion to her beloved.'),
E(19,'Dickinson','What do “oceans” and “prayer” mean in I Cannot Live With You?','They stand for the huge distance between the lovers. Only prayer and wide seas lie between them, so they cannot be together.'),
E(19,'Advice to Women','In Advice to Women, what does the “stare of perpetual surprise” teach?','The cat’s wide-eyed stare teaches a woman to cope with the “otherness” of lovers: they are different and strange, and she should not be hurt by that.'),
E(19,'Bliss','What does Bertha discover about Pearl at the end of Bliss?','That Pearl is having an affair with Bertha’s husband, Harry.'),
E(19,'Vindication','To whom did Wollstonecraft dedicate A Vindication of the Rights of Woman, and why?','To M. Talleyrand-Périgord, a French statesman. She asks him to support education and rights for women in the new French constitution.'),
E(20,'Tonight I Can Write','What revolves in the sky and sings in Tonight I Can Write?','The night wind.'),
E(20,'Tonight I Can Write','Define anaphora. Give an example from Tonight I Can Write.','Repeating the same word or phrase at the start of lines. Example: “Tonight I can write…” comes back again and again.'),

T2(16,'The Shroud','Why do Ghisu and Madhav spend the money meant for Budhia’s shroud on food and drink?','They are poor, lazy and hopeless. They think the dead woman will not miss a shroud, since someone will give one anyway, so they use the money for one good meal.'),
T2(16,'The Shroud','What is the irony in the title of The Shroud?','The shroud is never bought. The money meant for it is spent on a feast, so the title points to a cloth the dead woman never gets.'),
T2(16,'The Shroud','How does The Shroud show the effects of poverty and caste? Give two points.','1) Ghisu and Madhav are low-caste labourers, and poverty has killed their shame, hope and wish to work. 2) A feast is the only joy they expect in life, and even a woman’s death cannot move them.'),
T2(16,'Rebati','Why is Rebati an important story in Odia literature?','Fakir Mohan Senapati wrote it in 1898, and it is counted among the first modern Odia short stories. It shows a village that opposes girls’ education.'),
T2(16,'Home and the World','Who tell the story in The Home and the World, and how?','Three people tell it in turn, each in their own voice: Bimala, her husband Nikhil and his friend Sandip. Each gives a different side of the same events.'),
T2(16,'Home and the World','How does Bimala change in The Home and the World?','She steps out of the women’s quarters and is drawn to Sandip’s fiery Swadeshi speeches and to Sandip himself. Later she sees his greed and falseness and understands Nikhil’s worth.'),
T2(16,'Home and the World','How do Nikhil and Sandip differ in their view of Swadeshi?','Nikhil wants freedom but rejects hatred and force, and wants people to choose freely. Sandip uses fiery speeches and pressure for the cause, and also for his own gain.'),
T2(16,'Silence!','What is the mock trial in Silence! The Court Is in Session, and what is the charge?','A troupe of amateur actors rehearses a game trial. Leela Benare is made the accused, charged with infanticide. The game turns real as they expose her private life and pregnancy.'),
T2(16,'Silence!','What does Silence! show about how society treats an unmarried pregnant woman?','The respectable men and women judge Benare, not the man equally responsible. Their moral talk is hypocrisy, and the court stays silent about men’s guilt.'),
T2(17,'Tradition & Individual Talent','What does Eliot mean by “historical sense”?','The feeling that the whole past of literature lives in the present. A poet writes with all of European literature in his bones, so he feels both timeless and of his own time.'),
T2(17,'Tradition & Individual Talent','Explain the platinum (catalyst) analogy in Eliot’s essay.','When oxygen and sulphur dioxide meet near platinum they form sulphurous acid, but the platinum stays unchanged. The poet’s mind is like the platinum: it joins feelings into something new without being changed itself.'),
T2(17,'Tradition & Individual Talent','What is Eliot’s impersonal theory of poetry?','Poetry is not letting loose one’s own feelings but escaping from them. The poet grows by continually giving up his personality for the work.'),
T2(17,'Pater: Conclusion','What does Pater mean by burning with a “hard, gem-like flame”?','To live with sharp, steady intensity and get the most from every moment. Because life is short and always changing, we should feel each impression fully.'),
T2(17,'Modern Fiction','What does Woolf ask the novelist to look at in “an ordinary mind on an ordinary day”?','The mind receives countless small impressions, like atoms falling. Woolf wants the writer to record these as they fall, not follow a neat plot.'),
T2(18,'Iliad I–II','Why do Agamemnon and Achilles quarrel in Book I?','Agamemnon must give back Chryseis, so he takes Briseis, Achilles’ prize, to make up for it. Achilles is insulted and withdraws from the fighting.'),
T2(18,'Iliad I–II','Who stops Achilles from killing Agamemnon, and how?','Athena, sent by Hera, grabs Achilles by his hair and tells him to use words, not the sword.'),
T2(18,'Oedipus the King','Who is Tiresias, and why does Oedipus get angry with him?','Tiresias is the blind prophet of Thebes. He says Oedipus himself is the killer of Laius, so Oedipus angrily accuses him and Creon of plotting against him.'),
T2(18,'Oedipus the King','How does Oedipus punish himself at the end?','He blinds himself with the brooches from Jocasta’s dress after she hangs herself, and asks to be sent into exile.'),
T2(18,'Pot of Gold','Why is Euclio always afraid in The Pot of Gold?','He finds a pot of gold hidden by his grandfather and is terrified someone will steal it, so he checks it again and again and suspects everyone.'),
T2(18,'Story of Bacchus','How does Juno cause Semele’s death?','Disguised as Semele’s old nurse, she tells Semele to ask Jupiter to show himself in his full glory. Semele is burned up by his lightning.'),
T2(19,'Wuthering Heights','Who narrate Wuthering Heights?','Lockwood, the tenant who opens the book, and Nelly Dean, the housekeeper who tells him the long story of the two families.'),
T2(19,'Wuthering Heights','Why does Heathcliff take revenge?','Hindley treats him like a servant, and Catherine marries Edgar Linton instead of him. He takes over both Wuthering Heights and Thrushcross Grange and ill-treats the next generation.'),
T2(19,'Draupadi','How does Dopdi defy Senanayak at the end of Draupadi?','After being gang-raped in custody, she refuses to wear clothes and stands naked before him. Her body, used to shame her, becomes her weapon, and he is afraid.'),
T2(19,'Bliss','How does Bliss end?','Bertha learns that Pearl and Harry are lovers. Her joy breaks, and she runs to the window, where the pear tree still looks perfect and unchanged.'),
T2(19,'Vindication','What does Wollstonecraft say about the education of women?','Women should be educated like men and taught to reason, not only to please. Without it they stay weak and dependent, and the whole society suffers.'),
T2(19,'Amar Jiban','Why is Amar Jiban important?','Rassundari Devi published it in 1876, and it is the first full autobiography in Bengali by a woman. She secretly taught herself to read while doing housework.'),
T2(20,'Far Cry from Africa','What is the poet’s dilemma in A Far Cry from Africa?','He has African and English blood and loves the English language, so he cannot take one side. He is torn right through, in his very blood, between them.'),
T2(20,'Empire Writes Back','What do abrogation and appropriation mean in The Empire Writes Back?','Abrogation is rejecting the coloniser’s English as the standard. Appropriation is taking that language and bending it to carry the writer’s own culture and experience.'),
T2(20,'Things Fall Apart','Why does Okonkwo kill Ikemefuna?','He fears looking weak, so he strikes the boy who calls him father, even though the old man Ezeudu warned him not to.')
);

["Impressions","brief, passing moments of feeling and perception in the mind"],["Art for art’s sake","the belief that art exists to give beauty and delight, not moral lessons"]]},"Eagleton: Literature & History":{"type":"Essay","gist":"Terry Eagleton explains how Marxist criticism links literature to history, class, ideology and the economic base of society.","terms":[["Base","the economic foundation of society, including how goods are made and owned"],["Superstructure","the law, politics, religion, art and literature built upon the economic base"],["Vulgar Marxism","the overly simple view that the economy directly and mechanically controls literature"],["Ideology","the set of beliefs and values through which people understand their society"],["Relative autonomy","the idea that literature has partial independence from the economy"]]},"Modern Fiction":{"type":"Essay","gist":"Virginia Woolf argues that modern novelists should capture the mind’s fleeting impressions of life rather than focus on rigid plots and material details.","terms":[["Materialists","Woolf’s term for H.G. Wells, Arnold Bennett and John Galsworthy"],["Spiritual","Woolf’s term for James Joyce, who focuses on the inner life of the mind"],["Luminous halo","Woolf’s image for real life, rather than a neat row of street lamps"],["Ordinary mind","the everyday human mind receiving countless small impressions like falling atoms"],["Stream of consciousness","a modern narrative style that follows the continuous flow of thoughts"]]},"Sonnet 43":{"type":"Poem","gist":"The speaker counts the many ways she loves her beloved, promising a devotion that will grow even stronger after death.","terms":[["Petrarchan sonnet","a 14-line poem split into an eight-line octave and a six-line sestet"],["Sonnets from the Portuguese","the 1850 love-poem collection written for Robert Browning"],["Lost saints","the childhood religious faith she now gives to her beloved"],["Sun and candle-light","daily love shown both in public daytime and quiet night-time"],["Anaphora","repeating “I love thee” at the start of several lines to build emotion"]]},"Dickinson":{"type":"Poem","gist":"The speaker explains why she can neither live, die, nor enter Heaven with her beloved, leaving them apart in despair.","terms":[["Sexton","a church officer who locks away life like a precious cup behind a shelf"],["Porcelain","a fragile, fine cup used as a symbol for life with the beloved"],["Slant rhyme","near rhyme where sounds almost match, common in Dickinson’s verse"],["Dashes","Dickinson’s signature punctuation creating pauses and quiet tension"],["White Sustenance","the cold, pale nourishment of despair that keeps the lovers going apart"]]},"Advice to Women":{"type":"Poem","gist":"The speaker advises women to keep cats so they can understand the strangeness of lovers and learn to face solitude calmly.","terms":[["Otherness","the idea that lovers are separate, strange beings who cannot be fully owned"],["Cats","independent animals used as a model for coping with a lover’s distance"],["Perpetual surprise","the cat’s wide green-eyed stare that teaches emotional steadiness"],["Free verse","poetry without a fixed rhyme scheme or regular beat"],["Irony","a dry, understated tone used to give tough advice about love"]]},"Wuthering Heights":{"type":"Novel","gist":"A fierce, destructive love and a long quest for revenge bind two Yorkshire families across two generations.","terms":[["Frame narrative","a story inside a story, with Lockwood recording Nelly Dean’s account"],["Gothic","a dark style filled with wild moors, ghosts, cruelty and intense passion"],["Wuthering Heights","the stormy hilltop house representing wild passion and anger"],["Thrushcross Grange","the sheltered valley house representing polite, calm society"],["Ellis Bell","the male pen name Emily Brontë used when publishing the novel in 1847"]],"rel":{"n":["Heathcliff","Catherine","Edgar","Hindley","Nelly Dean","Lockwood"],"e":[["Heathcliff","Catherine","deep soulmates","l"],["Catherine","Edgar","marries him","f"],["Hindley","Catherine","older brother","f"],["Hindley","Heathcliff","abuses him","x"],["Heathcliff","Edgar","bitter rivals","x"],["Nelly Dean","Lockwood","tells the story","o"]]}},"Draupadi":{"type":"Story","gist":"A tribal woman rebel hunted by the state turns her brutal abuse in custody into an act of fearless defiance.","terms":[["Subaltern","marginalised people kept outside power and denied a public voice"],["Santhal","the indigenous tribal community to which Dopdi Mejhen belongs"],["Naxalite","the armed rural peasant uprising forming the story’s backdrop"],["Counter-insurgency","state military tactics used by Senanayak to crush rebels"],["Mythic reversal","rewriting the Mahabharata’s disrobing scene so Dopdi refuses clothes"]],"rel":{"n":["Dopdi Mejhen","Dulna Majhi","Senanayak","Surja Sahu"],"e":[["Dopdi Mejhen","Dulna Majhi","husband and comrade","f"],["Senanayak","Dopdi Mejhen","hunts and fears her","x"],["Senanayak","Dulna Majhi","his force kills him","x"],["Dopdi Mejhen","Surja Sahu","with Dulna, kills the landlord","x"]]}},"Bliss":{"type":"Story","gist":"A young wife bursts with sudden joy during a dinner party until she discovers that her husband and her admired guest are secret lovers.","terms":[["Pear tree","the blooming garden tree that mirrors Bertha’s joy and later stays unchanged"],["Modernism","a literary style focusing on inner mood and sudden awareness rather than plot"],["Epiphany","the sudden, painful moment when Bertha sees the truth about Harry and Pearl"],["Dramatic irony","the gap between Bertha’s innocent excitement and Harry’s hidden betrayal"],["Bliss","the intense, glowing feeling of happiness that collapses by the end"]],"rel":{"n":["Bertha Young","Harry Young","Pearl Fulton"],"e":[["Bertha Young","Harry Young","husband and wife","f"],["Harry Young","Pearl Fulton","secret affair","l"],["Bertha Young","Pearl Fulton","admires deeply","o"]]}},"Vindication":{"type":"Essay","gist":"Mary Wollstonecraft argues that women possess the same capacity for reason as men and must receive equal education to become truly virtuous.","terms":[["Reason","the ability to think clearly, which Wollstonecraft says distinguishes humans"],["Virtue","true moral strength gained through knowledge and choice, not blind obedience"],["Standing army","her comparison for women trained in manners and obedience instead of thought"],["Rousseau","the French philosopher she criticises for saying women exist to please men"],["Enlightenment","the 18th-century movement valuing reason, liberty and human rights"]]},"Amar Jiban":{"type":"Autobiography","gist":"Rassundari Devi recounts her confined life as a 19th-century Bengali housewife who secretly taught herself to read.","terms":[["Amar Jiban","Bengali title meaning My Life, published in 1876"],["Antahpur","the inner women’s quarters where upper-caste women were kept secluded"],["Caged bird","Rassundari’s image for her trapped, powerless life after early marriage"],["Chaitanya Bhagavata","the sacred Bengali book she longed to read and used to teach herself"],["Enakshi Chatterjee","the translator of the prescribed English version"]]},"Tonight I Can Write":{"type":"Poem","gist":"A lonely speaker writes his saddest lines about a lost love while looking up at the starry night.","terms":[["Anaphora","repeating “Tonight I can write” at the start of lines to show deep grief"],["Elegy","a sad poem mourning a loss, here the end of a love affair"],["Personification","giving human actions to nature, such as the night wind singing"],["Antithesis","placing opposite ideas side by side, as when love is called short and forgetting long"],["Spanish","the original language in which the Chilean poet Pablo Neruda wrote"]]},"Far Cry from Africa":{"type":"Poem","gist":"A poet of mixed African and English heritage feels painfully torn as he watches colonial violence and the Mau Mau uprising in Kenya.","terms":[["Mau Mau","the Kenyan anti-colonial uprising of the 1950s against British rule"],["Kikuyu","the Kenyan people at the centre of the Mau Mau rebellion"],["Divided loyalty","the speaker’s painful split between his African and English blood"],["Zoomorphism","comparing human cruelty in war to wild animals such as flies and lions"],["Saint Lucia","the Caribbean island homeland of Derek Walcott"]]},"Things Fall Apart":{"type":"Novel","gist":"A proud Igbo warrior’s rigid fear of weakness leads to his downfall as British colonial rule and Christian missionaries break apart his clan.","terms":[["Igbo","the people of Umuofia whose rich culture, festivals and laws Achebe shows"],["Chi","a person’s personal spirit or destiny in Igbo belief"],["Tragic hero","Okonkwo, whose noble strength and fear of weakness bring his ruin"],["Colonialism","British rule, courts and missionaries imposing foreign power on Umuofia"],["Proverbs","short traditional sayings prized by the Igbo as the palm-oil of speech"]],"rel":{"n":["Okonkwo","Unoka","Nwoye","Ikemefuna","Ezinma","Obierika"],"e":[["Unoka","Okonkwo","lazy father he resents","x"],["Okonkwo","Nwoye","son, disowns him","x"],["Okonkwo","Ikemefuna","foster son, kills him","x"],["Okonkwo","Ezinma","favourite daughter","f"],["Obierika","Okonkwo","wise, loyal friend","o"]]}},"Empire Writes Back":{"type":"Essay","gist":"Ashcroft, Griffiths and Tiffin explain how writers from former colonies reshape the English language to express their own cultures and challenge imperial power.","terms":[["Abrogation","rejecting standard British English as the only correct form of the language"],["Appropriation","taking the English language and adapting it to carry local culture"],["English vs english","distinguishing imperial standard English from local post-colonial varieties"],["Canon","the traditional list of great books, long controlled by European writers"],["Post-colonial","all cultures affected by empire from colonisation up to the present"]]}};

S7.cards.push(...[[18,"Iliad I–II","Who is Thetis, and what does she ask Zeus to do for Achilles in Book I?","Thetis is the sea-goddess mother of Achilles. She begs Zeus to let the Trojans win for a time so Agamemnon realises how much he needs Achilles.","ex"],[18,"Oedipus the King","Why did Laius and Jocasta abandon Oedipus as a baby?","An oracle warned them that their son would kill his father. To prevent this, they pierced his ankles and gave him to a shepherd to leave on Mount Cithaeron.","ex"],[18,"Story of Bacchus","How does Pentheus die in Ovid’s Story of Bacchus?","Pentheus goes to Mount Cithaeron to spy on the rites of Bacchus. His mother Agave and her sisters, driven mad by the god, mistake him for a wild boar and tear him apart.","ex"],[18,"Pot of Gold","Why does the Lar Familiaris help Euclio find the hidden pot of gold?","Euclio’s daughter Phaedria honours the household god every day with incense, wine and garlands. The Lar reveals the gold to Euclio so she can have a proper dowry for her marriage.","ex"],[18,"Satires I.4","Why does Horace criticise his forerunner Lucilius in Satires I.4?","Horace praises Lucilius for his wit and honesty, but says he wrote too fast and too carelessly. Horace compares his verse to a muddy river that needs careful polishing.","ex"],[18,"Satires I.4","Who taught Horace to observe people’s faults, and why?","Horace’s father taught him by pointing out real people in Rome as examples of bad behaviour. He did this not out of cruelty, but to help his son live a good, sensible life.","ex"],[18,"Iliad I–II","Who is Thersites, and why does Odysseus beat him in Book II?","Thersites is an ugly, loud-mouthed Greek soldier who insults Agamemnon and urges the men to sail home. Odysseus beats him with a sceptre to stop mutiny and keep order in the army.","e2"],[18,"Oedipus the King","Who raised Oedipus in Corinth, and why did he leave them?","King Polybus and Queen Merope raised him as their own son. He left Corinth after hearing the oracle’s prophecy, hoping to avoid killing Polybus and marrying Merope.","e2"],[18,"Pot of Gold","How is Lyconides related to Megadorus, and why does he speak to Euclio?","Lyconides is Megadorus’s nephew. He comes to confess that he wronged Euclio’s daughter Phaedria at a festival and wants to marry her.","e2"],[18,"Satires I.4","Why does Horace say he is not a true poet when writing satire?","Horace says his satires use plain, everyday speech close to prose, not grand heroic language. He leaves the title of true poet to writers with lofty inspiration and noble style.","e2"],[18,"Iliad I–II","Sea-goddess mother of Achilles?","Thetis","sp"],[18,"Iliad I–II","Soldier beaten by Odysseus in Book II?","Thersites","sp"],[18,"Oedipus the King","Mountain where baby Oedipus was left?","Cithaeron","sp"],[18,"Oedipus the King","King of Corinth who raised Oedipus?","Polybus","sp"],[18,"Story of Bacchus","Sailor who warns Pentheus of Bacchus’s power?","Acoetes","sp"],[18,"Pot of Gold","Rich neighbour who asks to marry Phaedria?","Megadorus","sp"],[18,"Satires I.4","Roman satirist whom Horace criticises for careless speed?","Lucilius","sp"],[18,"Satires I.4","Horace’s Latin name for his satires, meaning talks?","Sermones","sp"],[16,"Rebati","What is the background and main theme of Fakir Mohan Senapati’s Rebati?","Written in 1898 in rural Odisha, the story is set in a traditional village where girls are not expected to study. Its main theme is the clash between a girl’s desire for education and deep-rooted superstition.","ex"],[16,"The Shroud","How does Premchand use irony in The Shroud? Give two examples.","1) Ghisu and Madhav beg money for Budhia’s burial cloth, yet spend every coin on food and liquor. 2) While getting drunk on her funeral money, they bless her soul for giving them a grand feast.","ex"],[16,"Home and the World","What is the historical background of Tagore’s The Home and the World?","The novel is set in Bengal during the Swadeshi movement after the 1905 Partition of Bengal. People were urged to boycott British goods and use Indian products, which led to both passion and communal tension.","ex"],[16,"Silence!","How does Vijay Tendulkar expose middle-class hypocrisy in Silence! The Court Is in Session? Give two instances.","1) The troupe puts Leela Benare on trial for being pregnant and unmarried, but never blames Professor Damle, the man equally responsible. 2) Characters like Sukhatme and Kashikar speak loudly about morality while taking pleasure in humiliating a helpless woman.","ex"],[16,"Gitanjali","What are the main themes of Tagore’s Gitanjali? Mention two.","1) Humble devotion and the soul’s longing to unite with God. 2) Finding God not in grand temples, but among ordinary working people and in the simple beauty of nature.","ex"],[16,"The Quilt","Why is the story of The Quilt told through the eyes of a young child?","Because the child does not understand adult sexuality, she reports what she sees with innocent honesty. This lets Chughtai hint at a forbidden relationship without stating it directly.","e2"],[16,"Silence!","What is the significance of Leela Benare’s final monologue in Silence!?","In her long speech, Benare defends her love for life, her work as a teacher and her unborn child. It exposes the cruelty of the mock court and shows her dignity against a hypocritical society.","e2"],[16,"The Quilt","Original Urdu title of The Quilt?","Lihaaf","sp"],[16,"The Shroud","Original Hindi title of The Shroud?","Kafan","sp"],[16,"Home and the World","Movement to boycott foreign goods?","Swadeshi","sp"],[16,"Silence!","Professor who is the father of Benare’s unborn child?","Damle","sp"],[16,"Silence!","Failed lawyer who prosecutes Benare in the mock trial?","Sukhatme","sp"],[17,"Tradition & Individual Talent","Which Romantic poet’s definition of poetry does Eliot oppose, and what is that exact phrase?","Eliot opposes William Wordsworth’s phrase “emotion recollected in tranquillity.” He argues that poetry is not a turning loose of emotion, but an escape from emotion.","ex"],[17,"Pater: Conclusion","From which book is Pater’s Conclusion taken, and why did he remove it from the second edition?","It is taken from Studies in the History of the Renaissance (1873). Pater removed it in 1877 because he feared it might mislead young readers into a selfish pursuit of pleasure, before restoring it in 1888.","ex"],[17,"Pater: Conclusion","Which ancient Greek philosopher does Pater quote at the start of the Conclusion, and what does the quote mean?","He quotes Heraclitus, who said that all things are in motion and nothing remains still. Pater uses this idea of constant flux to show how briefly every moment lasts.","ex"],[17,"Eagleton: Literature & History","What does Terry Eagleton mean by “ideology” in Literature and History?","Ideology means the ideas, values and beliefs through which people understand their society. In Marxist theory, it often hides real class inequalities and serves the interests of the ruling class.","ex"],[17,"Tradition & Individual Talent","What does Eliot mean by saying that “existing monuments” form an “ideal order”?","He means all great works of past literature form a complete, living order together. When a truly new work of art is created, that entire order shifts slightly to make room for it.","e2"],[17,"Pater: Conclusion","Why does Walter Pater say that “failure is to form habits”?","Because habits trap us in dull, mechanical routines so we stop truly noticing the world. Pater believes we must stay awake to fresh, sharp impressions in every passing moment.","e2"],[17,"Eagleton: Literature & History","What does “relative autonomy” mean in Marxist literary theory?","It means that literature and art are not simple, mechanical copies of the economy. While the economic base shapes society in the last instance, literature has its own rules and partial independence.","e2"],[17,"Modern Fiction","Why does Virginia Woolf praise Russian writers like Anton Chekhov in Modern Fiction?","She praises them for looking deeply into the human soul and heart rather than relying on neat endings or outer trimmings. She admires their honesty and their sympathy for ordinary human suffering.","e2"],[17,"Tradition & Individual Talent","Metal used in Eliot’s catalyst analogy?","Platinum","sp"],[17,"Tradition & Individual Talent","Romantic poet whose formula Eliot rejects?","Wordsworth","sp"],[17,"Pater: Conclusion","Greek philosopher of flux quoted by Pater?","Heraclitus","sp"],[17,"Pater: Conclusion","Book title: Studies in the History of the ___?","Renaissance","sp"],[17,"Eagleton: Literature & History","System of beliefs that hides class power?","Ideology","sp"],[17,"Eagleton: Literature & History","Co-author with Karl Marx?","Engels","sp"],[17,"Modern Fiction","Novel by James Joyce praised by Woolf?","Ulysses","sp"],[17,"Modern Fiction","Russian short-story writer praised by Woolf?","Chekhov","sp"],[19,"Sonnet 43","What does Elizabeth Barrett Browning mean by loving “by sun and candle-light” in Sonnet 43?","It means her love fills every ordinary hour of the day and night. She loves her beloved not only in grand moments, but in quiet, everyday life.","ex"],[19,"Dickinson","Why does the speaker say she “could not rise” with her beloved in I Cannot Live With You?","She feels his face would outshine the face of Jesus in Heaven. Because she would worship him more than God, she fears she could not be saved alongside him.","ex"],[19,"Advice to Women","Why does Eunice de Souza advise women to “keep cats” in Advice to Women?","Cats are independent and distant, yet they return when they need to. Watching them helps women understand that a lover’s distance is not always cruel neglect and teaches them to stand alone.","ex"],[19,"Wuthering Heights","What do the two houses, Wuthering Heights and Thrushcross Grange, symbolise in the novel?","Wuthering Heights stands for wild nature, fierce passion and storminess. Thrushcross Grange stands for calm, polite civilisation and gentle manners.","ex"],[19,"Draupadi","How does the ending of Mahasweta Devi’s Draupadi reverse the episode of Draupadi in the Mahabharata?","In the epic, Krishna miraculously provides endless cloth to protect Draupadi’s honour from being stripped. In the story, no god saves Dopdi, so she refuses clothes and uses her naked, wounded body to terrify Senanayak.","ex"],[19,"Amar Jiban","How did Rassundari Devi secretly teach herself to read in Amar Jiban?","She hid a page of the Chaitanya Bhagavata and, working quietly between household chores, compared its letters with the alphabet her son was learning, until she could read.","ex"],[19,"Bliss","What does the pear tree symbolise for Bertha Young in Katherine Mansfield’s Bliss, and how does it look at the end?","At first, Bertha sees the blooming pear tree as a symbol of her own bright, complete life and her bond with Pearl. At the end, after discovering the affair, the tree still stands lovely and calm, showing nature’s indifference to her grief.","e2"],[19,"Vindication","Why does Mary Wollstonecraft compare women to a “standing army” in A Vindication of the Rights of Woman?","Like soldiers in a standing army, women are taught to obey blindly, care about outer show and learn manners before morals. Both groups are kept from thinking for themselves, which weakens their character.","e2"],[19,"Wuthering Heights","What happens during Lockwood’s nightmare at the window of Wuthering Heights?","Lockwood dreams that an icy hand grips him through the broken windowpane while a weeping child’s voice cries “Let me in!” and names herself Catherine Linton. Terrified, he rubs her wrist against the broken glass until he wakes up screaming.","e2"],[19,"Amar Jiban","Why does Rassundari Devi compare herself to a “caged bird” in Amar Jiban?","Married at twelve and kept inside the women’s quarters, she had to obey everyone and work endlessly without freedom. The image shows her sorrow at being trapped like a bird locked inside a cage.","e2"],[19,"Sonnet 43","Surname of the poet of Sonnet 43?","Browning","sp"],[19,"Dickinson","Surname of the poet of I Cannot Live With You?","Dickinson","sp"],[19,"Advice to Women","Surname of the poet of Advice to Women?","de Souza","sp"],[19,"Draupadi","Army officer who hunts Dopdi?","Senanayak","sp"],[19,"Draupadi","Surname of the translator of Draupadi?","Spivak","sp"],[19,"Bliss","Guest who has a secret affair with Harry?","Pearl Fulton","sp"],[19,"Vindication","French thinker criticised by Wollstonecraft?","Rousseau","sp"],[20,"Tonight I Can Write","Define antithesis and give an example from Pablo Neruda’s Tonight I Can Write.","Antithesis places two opposite ideas side by side to create a sharp contrast. Example: the poet says love is brief, while forgetting is very long.","ex"],[20,"Far Cry from Africa","How does Derek Walcott use animal imagery in A Far Cry from Africa? Give an example.","He compares human cruelty in the Kenyan conflict to wild creatures to show how colonialism and war turn people savage. For example, the Kikuyu fighters are likened to flies feeding on the blood of the veldt.","ex"],[20,"Things Fall Apart","Who is Unoka, and why is Okonkwo ashamed of him in Things Fall Apart?","Unoka is Okonkwo’s father, a gentle, debt-ridden musician who disliked hard work and war. Okonkwo is deeply ashamed of him because he fears being seen as weak and unsuccessful like his father.","ex"],[20,"Empire Writes Back","What is the difference between “English” and “english” in The Empire Writes Back?","Capital-E “English” stands for the standard language of the British imperial centre. Small-e “english” refers to the many local varieties adapted by post-colonial peoples to express their own cultures.","ex"],[20,"Things Fall Apart","Who is Nwoye, and why does he convert to Christianity in Things Fall Apart?","Nwoye is Okonkwo’s eldest son, who is sensitive and troubled by his father’s harshness. He joins the Christian missionaries because he is deeply hurt by the killing of Ikemefuna and the clan’s custom of abandoning twins.","e2"],[20,"Things Fall Apart","Why does Okonkwo take his own life at the end of Things Fall Apart?","After killing a colonial court messenger, Okonkwo realises that Umuofia will not rise up to fight the British. Unable to live under colonial rule or watch his clan’s traditions collapse, he hangs himself.","e2"],[20,"Tonight I Can Write","Placing two opposite ideas side by side?","Antithesis","sp"],[20,"Far Cry from Africa","Kenyan people named in A Far Cry from Africa?","Kikuyu","sp"],[20,"Revolving Days","Surname of the Australian poet of Revolving Days?","Malouf","sp"],[20,"Things Fall Apart","Okonkwo’s wise and loyal friend in Umuofia?","Obierika","sp"],[20,"Things Fall Apart","Boy from Mbaino given to Umuofia, later killed?","Ikemefuna","sp"],[20,"Empire Writes Back","Rejecting imperial standard English as the norm?","Abrogation","sp"]]);})();

const Q=k=>k.c==='au'?`Who wrote “${k.t}”?`:k.q;
const EV=[['Internal 1','2026-11-26T11:30:00+05:30'],['Internal 2 and tutorial submission','2026-11-30T11:30:00+05:30'],['Viva begins','2026-12-07T11:30:00+05:30'],['DSCC-16 theory','2026-12-15T10:00:00+05:30'],['DSCC-17 theory','2026-12-17T10:00:00+05:30'],['DSCC-18 theory','2026-12-19T10:00:00+05:30'],['DSCC-19 theory','2026-12-21T10:00:00+05:30'],['DSCC-20 theory','2026-12-23T10:00:00+05:30']];
let F='all',TF='',G={};
const PC={16:'#d9822b',17:'#3b82c4',18:'#8e5cc4',19:'#d6527f',20:'#2f9e6b'},KC={f:'var(--ac)',l:'#d6527f',x:'#d9534f',o:'var(--mut)'},KN={f:'Family',l:'Love',x:'Conflict',o:'Other'};
const kind=l=>/kill|abus|defies|quarrel|trick|hunt|takes|disown|judge|neglect|fear|holds|rival|enem/i.test(l)?'x':/lover|soulmate|affair|marries|first asks|close/i.test(l)?'l':/father|mother|\bson\b|daughter|brother|husband|wife|nephew|sister|family/i.test(l)?'f':'o';
const dl=p=>{const e=EV.find(e=>e[0]==='DSCC-'+p+' theory');return e?Math.max(0,Math.ceil((new Date(e[1])-Date.now())/864e5)):0};
const sel=(f=()=>1)=>cards.filter(k=>(F==='all'||k.p==F)&&(!TF||k.t===TF)&&f(k));
const bx=k=>(S.c[k.id]||{b:0}).b;
const due=ks=>ks.filter(k=>!S.c[k.id]||S.c[k.id].d<=Date.now());
function queue(n,f){let ks=sel(f),d=sh(due(ks)).sort((a,b)=>bx(a)-bx(b));if(d.length<n)d=d.concat(sh(ks.filter(k=>!d.includes(k))).sort((a,b)=>bx(a)-bx(b)));return d.slice(0,n)}
function mcq(k){let q=Q(k),a=k.a,pool;
 if(k.c==='au'&&Math.random()<.5){q='Which text is by '+k.a+'?';a=k.t;pool=cards.filter(x=>x.c==='au'&&x.a!==k.a).map(x=>x.t)}
 else if(/^\d+$/.test(k.a)){const n=+k.a;pool=[n-1,n+1,n-3,n+2,n-7,n+5,n-10].map(String)}
 else pool=cards.filter(x=>x.c===k.c&&x.a!==k.a).map(x=>x.a);
 pool=sh([...new Set(pool)].filter(x=>x!==a));
 if(pool.length<3)pool=pool.concat(sh(cards.filter(x=>x.a!==a&&!/^\d+$/.test(x.a)).map(x=>x.a)));
 return{q,a,o:sh([...new Set(pool)].slice(0,3).concat(a))}}
function grade(k,ok){const c=S.c[k.id]||(S.c[k.id]={b:0,d:0});c.b=ok?Math.min(c.b+1,4):0;c.d=Date.now()+IV[c.b];save()}
function home(){G={};TF='';
 const ks=sel(),dn=due(ks).length,ms=ks.filter(k=>bx(k)>=3).length,lv=1+Math.floor(Math.sqrt(S.xp/50));
 const nx=EV.find(e=>new Date(e[1])>Date.now());let cd='<b>Theory exams are done.</b>';
 if(nx){const t=new Date(nx[1])-Date.now(),d=Math.floor(t/864e5),h=Math.floor(t%864e5/36e5);cd=`<small>Next up</small><b>${d}d ${h}h</b><span class=sub>${nx[0]}</span>`}
 const pc=Object.keys(S7.papers).map(p=>{const x=cards.filter(k=>k.p==p),m=x.filter(k=>bx(k)>=3).length,l=x.filter(k=>bx(k)>=1).length;return`<div class=pb style="--ac:${PC[p]}"><span>DSCC-${p} ${S7.papers[p].split(' ')[0]}</span><div class=bar><i class=l style="width:${l/x.length*100}%"></i><i style="width:${m/x.length*100}%"></i></div><small>${l}/${x.length} · ${dl(p)}d</small></div>`}).join('');
 $('#app').innerHTML=`<h1><svg width=32 height=32 viewBox="0 0 32 32" aria-hidden=true><rect width=32 height=32 rx=8 style="fill:var(--ac)"/><text x=16 y=21.5 text-anchor=middle font-family="JetBrains Mono,monospace" font-weight=700 font-size=15 style="fill:var(--bg)">S7</text></svg>Recall</h1>
 <div class=cd>${cd}</div>
 <div class=chips>${['all',...Object.keys(S7.papers)].map(p=>`<button class="${F==p?'on':''}" onclick="F='${p}';home()">${p==='all'?'All papers':'DSCC-'+p}</button>`).join('')}</div>
 <div class=stats><div><b>${dn}</b><small>due now</small></div><div><b>${Math.round(ms/ks.length*100)}%</b><small>mastered</small></div></div>
 <button class=pri onclick="go('quiz',10)">Start · 10 questions</button>
 <div class=gr><button onclick="study()"><b>Study guide</b><br><small>terms, who is who</small></button><button onclick="go('exam',8)"><b>Exam questions</b><br><small>recall, then check</small></button><button onclick="go('next',5)"><b>Internal 2</b><br><small>texts not yet asked</small></button><button onclick="go('flash',10)"><b>Flash cards</b><br><small>recall, then rate</small></button></div>
 <details><summary>More practice</summary><div class=gr style="margin:0 0 8px"><button onclick="go('spell',10)"><b>Spell it</b><br><small>type it exactly</small></button><button onclick="go('sprint',5)"><b>Sprint</b><br><small>5 questions, 2 marks</small></button><button onclick="go('weak',10)"><b>Weak spots</b><br><small>what you missed</small></button></div></details>
 <details><summary>Progress by paper</summary>${pc}<p class=sub style="margin-top:16px">Pale bar: right once. Solid: right 3 times in a row. Missed facts return sooner. Level ${lv}, ${S.xp} XP.</p></details>
 <button class=lk style="margin-top:24px" onclick=addd()>Add data or back up</button>`}
function go(m,n){const ks=queue(n,k=>m==='spell'?['au','ch','pl','pe','sp'].includes(k.c):m==='weak'?(S.c[k.id]&&bx(k)===0&&!/^(ex|e2|sp)$/.test(k.c)):m==='next'?k.c==='e2':m==='exam'||m==='sprint'?/^e/.test(k.c):m==='flash'?k.c!=='sp':!/^(ex|e2|sp)$/.test(k.c));
 if(!ks.length){alert('No cards for this filter.');return}
 G={m,q:ks.map(k=>({k})),i:0,ok:0,xp:0,combo:0,miss:[]};show()}
function show(){
 if(G.i>=G.q.length)return end();
 const k=G.q[G.i].k,m=G.m;
 let h=`<div class=bar><i style="width:${G.i/G.q.length*100}%"></i></div><p class=ctx>DSCC-${k.p} · ${k.t}</p>`;
 if(m==='spell')h+=`<h2>${Q(k)}</h2><input id=in autocomplete=off autocapitalize=off spellcheck=false aria-label=Answer><button class=pri onclick=chk()>Check</button>`;
 else if(m==='flash'||m==='exam'||m==='sprint'||m==='next')h+=`<h2${/^e/.test(k.c)?' class=l':''}>${Q(k)}</h2><div id=ans></div><button class=pri id=rv onclick=rev()>Show answer</button>`;
 else{G.x=mcq(k);h+=`<h2>${G.x.q}</h2>`+G.x.o.map((o,j)=>`<button class=opt onclick=pick(${j})>${o}</button>`).join('')}
 $('#app').innerHTML=h+`<p class=sub style="margin-top:24px">${G.i+1} of ${G.q.length} · <a href="#" onclick="home();return false" style="color:var(--mut)">Quit</a></p>`;
 if(m==='spell')$('#in').focus()}
function res(ok){const k=G.q[G.i].k;grade(k,ok);
 if(ok){G.ok++;G.combo++;G.xp+=10+Math.min(G.combo,5)}else{G.combo=0;G.miss.push(k);if(!G.q[G.i].r&&G.m!=='sprint')G.q.push({k,r:1})}}
const adv=()=>{G.i++;show()};
function pick(j){const x=G.x,ok=x.o[j]===x.a;document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=1;if(x.o[i]===x.a)b.classList.add('ok');else if(i===j)b.classList.add('no')});res(ok);setTimeout(adv,ok?600:1700)}
function chk(){const i=$('#in');if(i.disabled)return;const k=G.q[G.i].k,ok=N(i.value)===N(k.a);i.disabled=1;
 $('#app').insertAdjacentHTML('beforeend',`<p class=${ok?'g':'b'}>${ok?'Correct':'It is '+k.a}</p>`);res(ok);setTimeout(adv,ok?600:2000)}
function rev(){const k=G.q[G.i].k,a=k.a;$('#ans').innerHTML=`<p class=${a.length>40?'ea':'a'}>${a}</p>${/^e/.test(k.c)?`<p class=sub>${S7.pat[k.p]}</p>`:''}`;$('#rv').outerHTML='<div class=row><button onclick=fl(0)>Missed</button><button class=pri onclick=fl(1)>Got it</button></div>'}
function fl(ok){res(ok);adv()}
addEventListener('keydown',e=>{if(e.key==='Enter'&&G.m==='spell'&&$('#in'))chk()});
function end(){const t=G.q.filter(x=>!x.r).length,mu=[...new Set(G.miss)],right=t-mu.filter(k=>G.q.some(x=>x.k===k&&!x.r)).length;
 const d=new Date().toDateString();if(S.ld!==d){S.st=new Date(Date.now()-864e5).toDateString()===S.ld?S.st+1:1;S.ld=d}
 S.xp+=G.xp;save();
 const sc=G.m==='sprint'?`${right*2}/${t*2} marks`:`${right} of ${t} first time`;
 $('#app').innerHTML=`<h1>${sc}</h1><p class=sub style="margin:8px 0 0">+${G.xp} XP · ${S.st} day streak</p>${mu.length?'<h3>Revise these</h3>'+mu.map(k=>`<p class=f>${Q(k)} <b>${k.a}</b></p>`).join(''):'<p class=g>No misses.</p>'}
 <div style="margin-top:32px"><button class=pri onclick="go('${G.m}',${G.m==='sprint'?5:10})">Go again</button><button onclick=home()>Home</button></div>`}
const au=t=>(cards.find(k=>k.t===t&&k.c==='au')||{}).a||'';
const TX=[];cards.forEach(k=>{if(!TX.some(x=>x.t===k.t&&x.p===k.p))TX.push({p:k.p,t:k.t})});
function study(){const kn=t=>{const c=cards.filter(k=>k.t===t),l=c.filter(k=>bx(k)>=1).length;return c.length?l/c.length*100:0};
 let o=`<button class=lk onclick=home()>← Back</button><h2>Study guide</h2><div class=chips>${['all',...Object.keys(S7.papers)].map(p=>`<button class="${F==p?'on':''}" onclick="F='${p}';study()">${p==='all'?'All papers':'DSCC-'+p}</button>`).join('')}</div>`,cp='';
 TX.forEach((x,i)=>{if(F!=='all'&&x.p!=F)return;if(x.p!==cp){cp=x.p;o+=`<h3>DSCC-${x.p} ${S7.papers[x.p]}</h3>`}const s=S7.study[x.t]||{};o+=`<button class=wr style="--pc:${PC[x.p]}" onclick="work(${i})"><span><b>${x.t}</b><br><small>${au(x.t)}${s.type?' · '+s.type:''}</small></span><i class=mb><i style="width:${kn(x.t)}%"></i></i></button>`});
 $('#app').innerHTML=o}
function work(i){const x=TX[i],s=S7.study[x.t]||{},a=au(x.t),im=S7.img[a],ini=a.split(/[ ,.]+/).filter(Boolean).map(w=>w[0]).slice(0,2).join(''),tm=s.terms||[];
 $('#app').innerHTML=`<div style="--pc:${PC[x.p]}"><button class=lk onclick=study()>← Back</button><div class=hd><div class=ti><h2>${x.t}</h2><div class=sub>${a}</div><span class=ctx style="border-color:var(--pc)">${s.type?s.type+' · ':''}DSCC-${x.p}</span></div><div class=im style="border-color:var(--pc)">${im?`<img src="${im}" alt="" onerror="this.outerHTML='${ini}'">`:ini}</div></div>
 ${s.gist?`<div class=bx>${s.gist}</div>`:''}
 ${tm.length?`<p class=lb>Key terms</p><div class=tg>${tm.map(t=>`<div class=tl><b>${t[0]}</b><span>${t[1]}</span></div>`).join('')}</div>`:''}
 ${s.rel?`<p class=lb>Who is who</p><div class=bx>${graph(s.rel)}</div>`:''}
 ${s.gist||tm.length||s.rel?'':'<p class=sub>Nothing added yet. Use the AI prompt to fill this page.</p>'}
 <button class=pri onclick="F='all';TF=TX[${i}].t;go('quiz',10)">Practise this work</button></div>`}
let GR=[],HL='';
function graph(r){const n=r.n,E=r.e.filter(e=>n.includes(e[0])&&n.includes(e[1])),hub=n.find(s=>E.every(e=>e.includes(s))),o=n.filter(s=>s!==hub),m=o.length,P={};HL='';
 GR=E.map(e=>({a:e[0],b:e[1],l:e[2],k:e[3]||kind(e[2])}));
 o.forEach((s,i)=>{const t=-Math.PI/2+i*2*Math.PI/m;P[s]=[170+(hub?112:115)*Math.cos(t),(hub?125:130)+(hub?92:100)*Math.sin(t)]});if(hub)P[hub]=[170,125];
 const ks=[...new Set(GR.map(e=>e.k))];
 return`<svg viewBox="0 0 340 260" width=100% role=img aria-label="Relationship graph. Tap a name or a line.">${GR.map((e,i)=>{const p=P[e.a],q=P[e.b],d=`x1=${p[0]} y1=${p[1]} x2=${q[0]} y2=${q[1]}`;return`<g class=e${i} onclick="hl('e',${i})" style="cursor:pointer"><line ${d} stroke=transparent stroke-width=16 /><line ${d} stroke="${KC[e.k]}" stroke-width=2.5 ${e.k==='x'?'stroke-dasharray="6 4"':''} /></g>`}).join('')}${n.map(s=>{const w=s.length*7.2+18,c=s===hub;return`<g onclick="hl('n','${s}')" style="cursor:pointer"><rect x=${P[s][0]-w/2} y=${P[s][1]-14} width=${w} height=28 rx=14 style="fill:${c?'var(--ac)':'var(--cd)'};stroke:var(--ac)"/><text x=${P[s][0]} y=${P[s][1]+5} text-anchor=middle font-size=13 font-weight=700 style="fill:${c?'var(--bg)':'var(--ink)'}">${s}</text></g>`}).join('')}</svg><p class=cp id=cap aria-live=polite>Tap a name or a line.</p><div class=sw>${ks.map(k=>`<span><i style="background:${KC[k]}"></i>${KN[k]}</span>`).join('')}</div>`}
function hl(t,v){const key=t+v,on=(e,i)=>t==='e'?i===v:e.a===v||e.b===v,r=HL===key;HL=r?'':key;
 GR.forEach((e,i)=>document.querySelectorAll('.e'+i).forEach(x=>x.style.opacity=r||on(e,i)?1:.15));
 $('#cap').innerHTML=r?'Tap a name or a line.':GR.filter(on).map(e=>`<b style="color:${KC[e.k]}">${e.a} and ${e.b}</b>: ${e.l}`).join('<br>')}
function addd(){$('#app').innerHTML=`<button class=lk onclick=home()>← Back</button><h2>Add data</h2><p class=sub>Paste JSON from the AI prompt, or a progress backup. ${X.length?X.length+' data batches saved here.':''}</p><textarea id=ta rows=9 style="width:100%;font:12px monospace;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);color:var(--ink)"></textarea><p id=msg class=b></p><button class=pri onclick=addGo()>Add</button><button onclick="cp(S)">Copy progress backup</button><button onclick="cp(X)">Copy added data</button><button onclick="if(confirm('Remove added data? Progress stays.')){localStorage.removeItem('s7x');location.reload()}">Remove added data</button>`}
function addGo(){let v;try{v=JSON.parse($('#ta').value.replace(/^\s*```(json)?|```\s*$/g,'').trim())}catch(e){$('#msg').textContent='Not valid JSON. Ask the AI to fix it.';return}
 if(v&&v.c&&!Array.isArray(v)){Object.keys(v.c).forEach(i=>{if(!S.c[i]||S.c[i].b<v.c[i].b)S.c[i]=v.c[i]});S.xp=Math.max(S.xp,v.xp||0);save();location.reload();return}
 X.push(v);try{localStorage.setItem('s7x',JSON.stringify(X))}catch(e){$('#msg').textContent='Storage full.';return}location.reload()}
const cp=v=>navigator.clipboard.writeText(JSON.stringify(v)).then(()=>alert('Copied'));
home();
</script></body></html>
