<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f1ea">
<title>S7 Recall</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Newsreader:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ea;--ink:#1d1f27;--mut:#6b6e7a;--ac:#2f45c9;--ok:#1f8a4c;--no:#c23b3b;--cd:#fff;--ln:#d9d6cb;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#14161c;--ink:#e8e9ee;--mut:#9396a3;--ac:#8ea0ff;--ok:#4fcf86;--no:#ff7b7b;--cd:#1d2029;--ln:#2c303b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "JetBrains Mono",ui-monospace,monospace;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font:500 30px/1.15 Newsreader,Georgia,serif;margin:0 0 4px}
h2{font:500 24px/1.3 Newsreader,Georgia,serif;margin:14px 0 20px}
h3{font:700 14px/1.3 "JetBrains Mono",monospace;margin:20px 0 4px}
small,.sub,.ctx{color:var(--mut);font-size:13px}
button,input{font:inherit;color:inherit}
button{background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;margin:0 0 8px}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.pri{background:var(--ac);color:var(--bg);border-color:var(--ac);text-align:center;font-weight:700}
button:disabled{opacity:1;cursor:default}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--cd))}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--cd))}
input{width:100%;padding:12px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);margin:0 0 10px}
.row{display:flex;gap:8px}.row button{text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.chips button{width:auto;margin:0;padding:6px 10px;font-size:13px;border-radius:20px}
.chips .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stats div{border:1px solid var(--ln);border-radius:8px;padding:10px;background:var(--cd)}
.stats b{display:block;font-size:22px}
.bar{height:4px;background:var(--ln);border-radius:2px;overflow:hidden;margin-bottom:8px}.bar i{display:block;height:100%;background:var(--ac)}
.pb{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}.pb span{width:150px;flex:none}.pb .bar{flex:1;margin:0}
.g{color:var(--ok);font-weight:700}.b{color:var(--no);font-weight:700}.a{font-size:20px;font-weight:700;color:var(--ok)}
.f{margin:4px 0;border-bottom:1px solid var(--ln);padding-bottom:6px}
.cd{border-left:3px solid var(--ac);padding:4px 12px;margin:14px 0}
</style></head>
<body><main id="app"></main>
<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);
const N=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const K='s7v2';let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S.c=S.c||{};S.xp=S.xp||0;S.st=S.st||0;S.ld=S.ld||'';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const IV=[0,4,24,48,96].map(h=>h*36e5);
const cards=S7.cards.map(([p,t,q,a,c])=>({p,t,q,a,c,id:p+'|'+t+'|'+q+'|'+a}));
const Q=k=>k.c==='au'?`Who wrote “${k.t}”?`:k.q;
const EV=[['Internal 1','2026-11-26T11:30:00+05:30'],['Internal 2 and tutorial submission','2026-11-30T11:30:00+05:30'],['Viva begins','2026-12-07T11:30:00+05:30']];
let F='all',G={};
const sel=(f=()=>1)=>cards.filter(k=>(F==='all'||k.p==F)&&f(k));
const bx=k=>(S.c[k.id]||{b:0}).b;
const due=ks=>ks.filter(k=>!S.c[k.id]||S.c[k.id].d<=Date.now());
function queue(n,f){let ks=sel(f),d=sh(due(ks)).sort((a,b)=>bx(a)-bx(b));if(d.length<n)d=d.concat(sh(ks.filter(k=>!d.includes(k))).sort((a,b)=>bx(a)-bx(b)));return d.slice(0,n)}
function mcq(k){let q=Q(k),a=k.a,pool;
 if(k.c==='au'&&Math.random()<.5){q='Which text is by '+k.a+'?';a=k.t;pool=cards.filter(x=>x.c==='au'&&x.a!==k.a).map(x=>x.t)}
 else if(/^\d+$/.test(k.a)){const n=+k.a;pool=[n-1,n+1,n-3,n+2,n-7,n+5,n-10].map(String)}
 else pool=cards.filter(x=>x.c===k.c&&x.a!==k.a).map(x=>x.a);
 pool=sh([...new Set(pool)].filter(x=>x!==a));
 if(pool.length<3)pool=pool.concat(sh(cards.filter(x=>x.a!==a&&!/^\d+$/.test(x.a)).map(x=>x.a)));
 return{q,a,o:sh([...new Set(pool)].slice(0,3).concat(a))}}
function grade(k,ok){const c=S.c[k.id]||(S.c[k.id]={b:0,d:0});c.b=ok?Math.min(c.b+1,4):0;c.d=Date.now()+IV[c.b];save()}
function home(){G={};
 const ks=sel(),dn=due(ks).length,ms=ks.filter(k=>bx(k)>=3).length,lv=1+Math.floor(Math.sqrt(S.xp/50));
 const nx=EV.find(e=>new Date(e[1])>Date.now());let cd='Theory exams start in the 3rd week of December. Dates to be announced.';
 if(nx){const ms2=new Date(nx[1])-Date.now(),d=Math.floor(ms2/864e5),h=Math.floor(ms2%864e5/36e5);cd=`${nx[0]} in ${d}d ${h}h`}
 const pc=Object.keys(S7.papers).map(p=>{const x=cards.filter(k=>k.p==p),m=x.filter(k=>bx(k)>=3).length;return`<div class=pb><span>DSCC-${p} ${S7.papers[p].split(' ')[0]}</span><div class=bar><i style="width:${m/x.length*100}%"></i></div><small>${m}/${x.length}</small></div>`}).join('');
 $('#app').innerHTML=`<h1>S7 Recall</h1><small>${cards.length} facts across five papers</small>
 <div class=cd>${cd}</div>
 <div class=chips>${['all',...Object.keys(S7.papers)].map(p=>`<button class="${F==p?'on':''}" onclick="F='${p}';home()">${p==='all'?'All papers':'DSCC-'+p}</button>`).join('')}</div>
 <div class=stats><div><b>${dn}</b><small>due now</small></div><div><b>${Math.round(ms/ks.length*100)}%</b><small>mastered</small></div><div><b>${S.st}</b><small>day streak</small></div></div>
 <button class=pri onclick="go('quiz',10)">Quiz: 10 questions (${dn?'due first':'mixed'})</button>
 <button onclick="go('flash',10)"><b>Flash cards</b><br><small>see it, recall it, rate yourself</small></button>
 <button onclick="go('spell',10)"><b>Spell it</b><br><small>type names and titles exactly, accents forgiven</small></button>
 <button onclick="go('sprint',5)"><b>Internal sprint</b><br><small>5 questions at 2 marks each, like the real test</small></button>
 <button onclick="browse()"><b>Browse and search</b><br><small>every fact, grouped by text</small></button>
 <h3>Mastery by paper</h3>${pc}<small>Level ${lv} with ${S.xp} XP. Missed facts return sooner; known facts come back after 4 hours, 1, 2 and 4 days.</small>`}
function go(m,n){const ks=queue(n,m==='spell'?k=>['au','ch','pl','pe'].includes(k.c):undefined);
 if(!ks.length){alert('No cards for this filter.');return}
 G={m,q:ks.map(k=>({k})),i:0,ok:0,xp:0,combo:0,miss:[]};show()}
function show(){
 if(G.i>=G.q.length)return end();
 const k=G.q[G.i].k,m=G.m;
 let h=`<div class=bar><i style="width:${G.i/G.q.length*100}%"></i></div><p class=ctx>DSCC-${k.p} ${k.t}</p>`;
 if(m==='spell')h+=`<h2>${Q(k)}</h2><input id=in autocomplete=off autocapitalize=off spellcheck=false aria-label=Answer><button class=pri onclick=chk()>Check</button>`;
 else if(m==='flash')h+=`<h2>${Q(k)}</h2><div id=ans></div><button class=pri id=rv onclick=rev()>Show answer</button>`;
 else{G.x=mcq(k);h+=`<h2>${G.x.q}</h2>`+G.x.o.map((o,j)=>`<button class=opt onclick=pick(${j})>${o}</button>`).join('')}
 $('#app').innerHTML=h+`<p class=sub>${G.i+1} of ${G.q.length}. Combo ${G.combo}. <a href="#" onclick="home();return false" style="color:var(--mut)">Quit</a></p>`;
 if(m==='spell')$('#in').focus()}
function res(ok){const k=G.q[G.i].k;grade(k,ok);
 if(ok){G.ok++;G.combo++;G.xp+=10+Math.min(G.combo,5)}else{G.combo=0;G.miss.push(k);if(!G.q[G.i].r&&G.m!=='sprint')G.q.push({k,r:1})}}
const adv=()=>{G.i++;show()};
function pick(j){const x=G.x,ok=x.o[j]===x.a;document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=1;if(x.o[i]===x.a)b.classList.add('ok');else if(i===j)b.classList.add('no')});res(ok);setTimeout(adv,ok?600:1700)}
function chk(){const i=$('#in');if(i.disabled)return;const k=G.q[G.i].k,ok=N(i.value)===N(k.a);i.disabled=1;
 $('#app').insertAdjacentHTML('beforeend',`<p class=${ok?'g':'b'}>${ok?'Correct':'It is '+k.a}</p>`);res(ok);setTimeout(adv,ok?600:2000)}
function rev(){$('#ans').innerHTML='<p class=a>'+G.q[G.i].k.a+'</p>';$('#rv').outerHTML='<div class=row><button onclick=fl(0)>Missed</button><button class=pri onclick=fl(1)>Got it</button></div>'}
function fl(ok){res(ok);adv()}
addEventListener('keydown',e=>{if(e.key==='Enter'&&G.m==='spell'&&$('#in'))chk()});
function end(){const t=G.q.filter(x=>!x.r).length,mu=[...new Set(G.miss)],right=t-mu.filter(k=>G.q.some(x=>x.k===k&&!x.r)).length;
 const d=new Date().toDateString();if(S.ld!==d){S.st=new Date(Date.now()-864e5).toDateString()===S.ld?S.st+1:1;S.ld=d}
 S.xp+=G.xp;save();
 const sc=G.m==='sprint'?`${right*2}/${t*2} marks`:`${right} of ${t} first time`;
 $('#app').innerHTML=`<h1>${sc}</h1><p>+${G.xp} XP. Streak ${S.st} days.</p>${mu.length?'<h3>Revise these</h3>'+mu.map(k=>`<p class=f>${Q(k)} <b>${k.a}</b></p>`).join(''):'<p class=g>No misses.</p>'}
 <br><button class=pri onclick="go('${G.m}',${G.m==='sprint'?5:10})">Go again</button><button onclick=home()>Home</button>`}
function browse(){$('#app').innerHTML=`<button onclick=home()>Back</button><input id=sr placeholder="Search names, texts, answers" oninput=bl() aria-label=Search><div id=bl></div>`;bl()}
function bl(){const s=N($('#sr').value);let o='',t='';
 sel().filter(k=>!s||N(k.t+' '+Q(k)+' '+k.a).includes(s)).sort((a,b)=>a.p-b.p||a.t.localeCompare(b.t)).forEach(k=>{const h=k.p+k.t;if(h!==t){t=h;o+=`<h3>${k.t} <small>DSCC-${k.p}</small></h3>`}o+=`<p class=f>${Q(k)} <b>${k.a}</b></p>`});
 $('#bl').innerHTML=o||'<p class=sub>Nothing matches.</p>'}
home();
</script></body></html>
